name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      # The real hardware probe on a real runner: proves detection runs
      # (registry / WMI on Windows, sysctl on macOS, /proc on Linux) without crashing.
      - run: llm-bench --out ci-results check
      # check --json must stay parseable JSON on every OS (bash, so Windows
      # does not re-encode the pipe as UTF-16).
      - run: llm-bench --out ci-results check --json | python -c "import json, sys; json.load(sys.stdin)"
        shell: bash
